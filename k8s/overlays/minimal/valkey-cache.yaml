# Infrastructure: Renovate's package cache (RENOVATE_REDIS_URL), kept apart from coordination so a full cache
# can't block lock writes. It's only a cache: `allkeys-lru`, no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koshin-valkey-cache
  labels:
    app.kubernetes.io/name: koshin-valkey-cache
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: koshin-valkey-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: koshin-valkey-cache
        app.kubernetes.io/component: cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          args:
            - valkey-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 384mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: koshin-valkey-cache
  labels:
    app.kubernetes.io/name: koshin-valkey-cache
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: koshin-valkey-cache
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
