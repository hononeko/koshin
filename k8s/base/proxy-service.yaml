apiVersion: v1
kind: Service
metadata:
  name: koshin-proxy
  labels:
    app.kubernetes.io/name: koshin-proxy
    app.kubernetes.io/component: proxy
spec:
  selector:
    app.kubernetes.io/name: koshin-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      # Ingress controllers that support it talk cleartext HTTP/2 to the proxy
      appProtocol: kubernetes.io/h2c
