# The proxy's worker dispatcher (KSH-32): reads the worker PodTemplate and starts burst worker Jobs, in this namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: koshin-proxy
rules:
  - apiGroups: [""]
    resources: ["podtemplates"]
    resourceNames: ["koshin-worker"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "watch", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: koshin-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: koshin-proxy
subjects:
  - kind: ServiceAccount
    name: koshin-proxy
