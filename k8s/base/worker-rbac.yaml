# Lets each worker patch its own controller.kubernetes.io/pod-deletion-cost annotation, so KEDA scale-in
# removes idle workers before busy ones.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: koshin-worker
# The worker pod mounts a short-lived token into the worker container only
automountServiceAccountToken: false
---
# RBAC can't name a pod that doesn't exist yet: the admission policy below narrows this to the worker's own pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: koshin-worker
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: koshin-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: koshin-worker
subjects:
  - kind: ServiceAccount
    name: koshin-worker
---
# Cluster-scoped: a koshin-worker ServiceAccount, in any namespace, may only change the pod-deletion-cost annotation
# of its own pod: no other pod (in any namespace), and no spec, label or other metadata change.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: koshin-worker
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["*"]
        resources: ["pods", "pods/*"]
  matchConditions:
    - name: worker-service-account
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        request.userInfo.username.endsWith(':koshin-worker')
  variables:
    - name: costAnnotation
      expression: "'controller.kubernetes.io/pod-deletion-cost'"
    - name: annotations
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: oldAnnotations
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
  validations:
    # Unset fields are absent, not empty: reading one without has() is an error, and errors deny
    - expression: "request.operation == 'UPDATE' && (!has(request.subResource) || request.subResource == '')"
      message: The koshin worker may only patch pods.
    - expression: >-
        request.operation != 'UPDATE' ||
        (request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':koshin-worker' &&
        has(request.userInfo.extra) && 'authentication.kubernetes.io/pod-name' in request.userInfo.extra &&
        request.userInfo.extra['authentication.kubernetes.io/pod-name'] == [object.metadata.name])
      message: The koshin worker may only patch its own pod.
    - expression: >-
        request.operation != 'UPDATE' || (
        object.spec == oldObject.spec &&
        (has(object.metadata.labels) ? object.metadata.labels : {}) ==
        (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) &&
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) ==
        (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []) &&
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) ==
        (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : []) &&
        variables.annotations.all(k, k == variables.costAnnotation ||
        (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.annotations[k])) &&
        variables.oldAnnotations.all(k, k == variables.costAnnotation || k in variables.annotations))
      message: The koshin worker may only change the controller.kubernetes.io/pod-deletion-cost annotation.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: koshin-worker
spec:
  policyName: koshin-worker
  validationActions: [Deny]
