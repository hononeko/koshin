apiVersion: v1
kind: ServiceAccount
metadata:
  name: koshin-worker
# Workers never call the Kubernetes API (KSH-31): no token is mounted
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koshin-worker
  labels:
    app.kubernetes.io/name: koshin-worker
    app.kubernetes.io/component: worker
spec:
  # No `replicas`: KEDA (worker-scaledobject.yaml) owns the count.
  selector:
    matchLabels:
      app.kubernetes.io/name: koshin-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: koshin-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: koshin-worker
      # Workers never call the Kubernetes API (KSH-31): no container gets a token
      automountServiceAccountToken: false
      # Covers the SIGTERM path (kill the CLI, release the lock, NAK), not a full run
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 12021
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Copies the Renovate runner (JRE, koshin's jars, scripts) from the worker image for the `renovate` container
        - name: koshin-runner-init
          image: ghcr.io/hononeko/koshin-worker
          command: ["/opt/koshin/bin/koshin-runner-init", "/opt/koshin-dist"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runner-bin
              mountPath: /opt/koshin-dist
        # Renovate, and any repo code it runs, live in this container: no worker secrets, no ServiceAccount token.
        # The worker hands it each run over the runner socket. A native sidecar: it starts before the worker and
        # stops after it, so the SIGTERM path still kills the run itself. The tag is in kustomization.yaml.
        - name: renovate
          image: ghcr.io/renovatebot/renovate
          restartPolicy: Always
          # containerbase's entrypoint, without Renovate's, which would take a missing runner for a repository name
          command: ["/usr/local/sbin/docker-entrypoint.sh", "/opt/koshin/bin/koshin-runner"]
          env:
            - name: RUNNER_SOCKET
              value: /run/koshin/runner.sock
          startupProbe:
            exec:
              command: ["test", "-S", "/run/koshin/runner.sock"]
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: renovate
              mountPath: /tmp/renovate
            - name: runner
              mountPath: /run/koshin
            # Read-only, so a run can't change the runner for the next one
            - name: runner-bin
              mountPath: /opt/koshin
              readOnly: true
      containers:
        - name: worker
          image: ghcr.io/hononeko/koshin-worker
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: koshin-config
            # GITHUB_TOKEN, GITLAB_TOKEN (and optionally GITHUB_API_URL, GITLAB_ENDPOINT)
            - secretRef:
                name: koshin-worker-secrets
                optional: true
          env:
            - name: RUNNER_SOCKET
              value: /run/koshin/runner.sock
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: renovate
              mountPath: /tmp/renovate
            # Connecting needs no write access
            - name: runner
              mountPath: /run/koshin
              readOnly: true
      volumes:
        # Per-run workspaces, deleted after each run and purged at startup
        - name: renovate
          emptyDir:
            sizeLimit: 10Gi
        - name: runner
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # The runner, filled by koshin-runner-init
        - name: runner-bin
          emptyDir:
            sizeLimit: 512Mi
