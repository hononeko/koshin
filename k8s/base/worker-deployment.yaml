apiVersion: apps/v1
kind: Deployment
metadata:
  name: koshin-worker
  labels:
    app.kubernetes.io/name: koshin-worker
    app.kubernetes.io/component: worker
spec:
  # No `replicas`: KEDA (worker-scaledobject.yaml) owns the count.
  selector:
    matchLabels:
      app.kubernetes.io/name: koshin-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: koshin-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: koshin-worker
      # Covers the SIGTERM path (kill the CLI, release the lock, NAK), not a full run
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 12021
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/hononeko/koshin-worker
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: koshin-config
            # GITHUB_TOKEN, GITLAB_TOKEN (and optionally GITHUB_API_URL, GITLAB_ENDPOINT)
            - secretRef:
                name: koshin-worker-secrets
                optional: true
          env:
            - name: POD_DELETION_COST_ENABLED
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: renovate
              mountPath: /tmp/renovate
      volumes:
        # Per-run workspaces, deleted after each run and purged at startup
        - name: renovate
          emptyDir:
            sizeLimit: 10Gi
