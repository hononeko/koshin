apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: koshin

resources:
  - proxy-deployment.yaml
  - proxy-service.yaml
  - worker-rbac.yaml
  - worker-deployment.yaml
  - worker-scaledobject.yaml
  - cronjob-sweeper.yaml

configMapGenerator:
  - name: koshin-config
    literals:
      - PLATFORMS=github
      - NATS_URL=nats://koshin-nats:4222
      - VALKEY_URL=redis://koshin-valkey:6379
  # Repositories swept every 6 hours (`github:org/repo` or `gitlab:group/project`, one per line).
  # Replace it from an overlay with `behavior: replace`.
  - name: koshin-repositories
    files:
      - repositories.txt

images:
  - name: ghcr.io/hononeko/koshin-proxy
    newTag: latest
  - name: ghcr.io/hononeko/koshin-worker
    newTag: latest
