apiVersion: v1
kind: ServiceAccount
metadata:
  name: koshin-proxy
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koshin-proxy
  labels:
    app.kubernetes.io/name: koshin-proxy
    app.kubernetes.io/component: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: koshin-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: koshin-proxy
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: koshin-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: koshin-proxy
      containers:
        - name: proxy
          image: ghcr.io/hononeko/koshin-proxy
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: koshin-config
            # GITHUB_WEBHOOK_SECRET, GITLAB_WEBHOOK_SECRET, INTERNAL_TRIGGER_TOKEN
            - secretRef:
                name: koshin-proxy-secrets
                optional: true
          env:
            - name: SWEEP_REPOSITORIES_FILE
              value: /etc/koshin/repositories.txt
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: repositories
              mountPath: /etc/koshin
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: repositories
          configMap:
            name: koshin-repositories
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: koshin-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: koshin-proxy
