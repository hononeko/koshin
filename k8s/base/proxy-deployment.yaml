apiVersion: v1
kind: ServiceAccount
metadata:
  name: koshin-proxy
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koshin-proxy
  labels:
    app.kubernetes.io/name: koshin-proxy
    app.kubernetes.io/component: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: koshin-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: koshin-proxy
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: koshin-proxy
      # The worker dispatcher gets a short-lived token (kube-api-access) instead
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: koshin-proxy
      containers:
        - name: proxy
          image: ghcr.io/hononeko/koshin-proxy
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # NATS_URL, and VALKEY_URL for coalescing webhooks before publishing them
            - configMapRef:
                name: koshin-config
            # GITHUB_WEBHOOK_SECRET, GITLAB_WEBHOOK_SECRET, INTERNAL_TRIGGER_TOKEN
            - secretRef:
                name: koshin-proxy-secrets
                optional: true
          env:
            - name: SWEEP_REPOSITORIES_FILE
              value: /etc/koshin/repositories.txt
            # Burst worker Jobs from the koshin-worker PodTemplate
            - name: WORKER_DISPATCHER_ENABLED
              value: "true"
            - name: WORKER_POD_TEMPLATE_NAME
              value: koshin-worker
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: repositories
              mountPath: /etc/koshin
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: repositories
          configMap:
            name: koshin-repositories
        - name: tmp
          emptyDir: {}
        # What automountServiceAccountToken would mount, but short-lived
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: koshin-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: koshin-proxy
