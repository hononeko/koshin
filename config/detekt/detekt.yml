config:
  validation: true
  warningsAsErrors: false

ktlint:
  active: true
  code_style: 'intellij_idea'

naming:
  FunctionNaming:
    ignoreAnnotated: ['Test']

complexity:
  TooManyFunctions:
    allowedFunctionsPerClass: 20
    ignoreAnnotatedFunctions: ['Test']
  LongParameterList:
    allowedConstructorParameters: 12
