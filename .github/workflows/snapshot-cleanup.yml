name: Snapshot Cleanup

# Deletes a pull request's snapshot images (pr-<PR>, pr-<PR>-sha-<commit>) once it's closed, merged or not.
# Only branches of this repository get snapshots, and only their pull requests get a token that can delete packages.
# Dispatch it with the pull request's number to retry a cleanup that failed.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request whose snapshots to delete
        required: true
        type: number
      dry-run:
        description: Only log what would be deleted
        type: boolean
        default: false

jobs:
  prune:
    name: Prune Snapshots
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Check packages in GHCR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${{ github.repository_owner }}"
          proxy_exists=false
          worker_exists=false
          if gh api "orgs/$owner/packages/container/koshin-proxy" >/dev/null 2>&1 || \
             gh api "users/$owner/packages/container/koshin-proxy" >/dev/null 2>&1; then
            proxy_exists=true
          fi
          if gh api "orgs/$owner/packages/container/koshin-worker" >/dev/null 2>&1 || \
             gh api "users/$owner/packages/container/koshin-worker" >/dev/null 2>&1; then
            worker_exists=true
          fi
          echo "proxy=$proxy_exists" >> "$GITHUB_OUTPUT"
          echo "worker=$worker_exists" >> "$GITHUB_OUTPUT"

      - name: Prune koshin-proxy snapshots
        if: steps.check.outputs.proxy == 'true'
        uses: hononeko/actions/prune-snapshots@5532ca1e4b7254aed1f85fe64b6230941d6eed21 # v1.4.2
        with:
          package: koshin-proxy
          pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}
          dry-run: ${{ inputs.dry-run || false }}

      - name: Prune koshin-worker snapshots
        if: always() && steps.check.outputs.worker == 'true'
        uses: hononeko/actions/prune-snapshots@5532ca1e4b7254aed1f85fe64b6230941d6eed21 # v1.4.2
        with:
          package: koshin-worker
          pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}
          dry-run: ${{ inputs.dry-run || false }}
