name: Publish Snapshot Images

on:
  workflow_call:
    inputs:
      tag:
        description: Snapshot tag (e.g. pr-1-sha-abc)
        required: true
        type: string
      pr-number:
        description: Pull request number
        required: true
        type: number
      ref:
        description: Commit ref to check out
        required: false
        type: string
        default: ""

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: hashFiles('docker/Dockerfile.proxy') != '' || hashFiles('docker/Dockerfile.worker') != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish proxy snapshot
        id: publish-proxy
        if: hashFiles('docker/Dockerfile.proxy') != ''
        uses: hononeko/actions/publish-image@e1fdec215f80fc9a1574c61b15303f6789d09b7c # v1.4.7
        with:
          image: ghcr.io/${{ github.repository_owner }}/koshin-proxy
          tags: |
            ${{ inputs.tag }}
            pr-${{ inputs.pr-number }}
          digests-pattern: digests-proxy-*
          expected-digests: "2"
          title: Proxy Snapshot
          comment-on-pr: ${{ inputs.pr-number }}
          comment-note: For testing only. Deleted when this pull request closes.
          attest: "true"

      - name: Publish worker snapshot
        id: publish-worker
        if: hashFiles('docker/Dockerfile.worker') != ''
        uses: hononeko/actions/publish-image@e1fdec215f80fc9a1574c61b15303f6789d09b7c # v1.4.7
        with:
          image: ghcr.io/${{ github.repository_owner }}/koshin-worker
          tags: |
            ${{ inputs.tag }}
            pr-${{ inputs.pr-number }}
          digests-pattern: digests-worker-*
          expected-digests: "2"
          title: Worker Snapshot
          comment-on-pr: ${{ inputs.pr-number }}
          comment-note: For testing only. Deleted when this pull request closes.
          attest: "true"
