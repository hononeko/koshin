name: Continuous Delivery & Release

# On every push to main that warrants a new version:
# 1. Runs full verification (Detekt + Kover gates, unit tests, integration tests)
# 2. Uploads Detekt SARIF to GitHub Code Scanning to track the default branch
# 3. Builds and smoke-tests proxy and worker images (amd64 and arm64)
# 4. Publishes multi-arch images with release candidate, commit, version, and latest tags
# 5. Generates grouped release notes and publishes a GitHub release
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the next version and its release notes without releasing
        type: boolean
        default: false

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    inputs.dry_run && format('-dry-run-{0}', github.run_id) || '' }}${{
    github.ref != 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version-tag }}
      version_type: ${{ steps.version.outputs.version-type }}
      rc_version: ${{ steps.version.outputs.rc-version }}
      commit_tag: ${{ steps.version.outputs.commit-tag }}
      previous_tag: ${{ steps.version.outputs.previous-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Version
        id: version
        uses: hononeko/actions/version@v1

      - name: Release notes
        uses: hononeko/actions/release-notes@v1
        with:
          previous-tag: ${{ steps.version.outputs.previous-tag }}
          tag: ${{ steps.version.outputs.version-tag }}
          summary: Release notes for ${{ steps.version.outputs.version-tag }}

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: release-notes.md

      - name: Decide whether to release
        id: decide
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION_TAG: ${{ steps.version.outputs.version-tag }}
          VERSION_TYPE: ${{ steps.version.outputs.version-type }}
        run: |
          release=true
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run: not releasing $VERSION_TAG"; release=false
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::Releases are published from main only"; release=false
          elif [ "$VERSION_TYPE" = "none" ]; then
            release=false
          else
            git fetch -q origin main --tags
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "::warning::$GITHUB_SHA is no longer the tip of main; the newer push releases instead"; release=false
            elif git rev-parse -q --verify "refs/tags/$VERSION_TAG" >/dev/null; then
              echo "::warning::$VERSION_TAG already exists; not releasing it again"; release=false
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Code Verification
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      security-events: write

  integration:
    name: Integration Tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Gradle & JDK
        uses: hononeko/actions/gradle-setup@v1

      - name: Run Integration Tests
        run: ./gradlew integrationTest --no-daemon

  image:
    name: Image Build & Smoke Test
    needs: [plan, build, integration]
    if: needs.plan.outputs.release == 'true' || inputs.dry_run
    uses: ./.github/workflows/image.yml
    with:
      push: ${{ needs.plan.outputs.release == 'true' && !inputs.dry_run }}
      version: ${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      packages: write

  release:
    name: Tag & Release
    needs: [plan, build, integration, image]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ needs.plan.outputs.version_tag }}
    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes

      - name: Tag & create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION_TAG" --notes-file release-notes.md

  publish:
    name: Publish Images
    needs: [plan, image, release]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry (GHCR)
        if: hashFiles('docker/Dockerfile.proxy') != '' || hashFiles('docker/Dockerfile.worker') != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish proxy image
        id: publish-proxy
        if: hashFiles('docker/Dockerfile.proxy') != ''
        uses: hononeko/actions/publish-image@v1
        with:
          image: ghcr.io/${{ github.repository_owner }}/koshin-proxy
          tags: |
            ${{ needs.plan.outputs.version_tag }}
            ${{ needs.plan.outputs.version }}
            ${{ needs.plan.outputs.rc_version }}
            ${{ needs.plan.outputs.commit_tag }}
            latest
          digests-pattern: digests-proxy-*
          expected-digests: "2"
          title: Proxy Published
          attest: "true"

      - name: Publish worker image
        id: publish-worker
        if: hashFiles('docker/Dockerfile.worker') != ''
        uses: hononeko/actions/publish-image@v1
        with:
          image: ghcr.io/${{ github.repository_owner }}/koshin-worker
          tags: |
            ${{ needs.plan.outputs.version_tag }}
            ${{ needs.plan.outputs.version }}
            ${{ needs.plan.outputs.rc_version }}
            ${{ needs.plan.outputs.commit_tag }}
            latest
          digests-pattern: digests-worker-*
          expected-digests: "2"
          title: Worker Published
          attest: "true"

  chart:
    name: Publish Chart
    # After the images: the chart's appVersion points at them
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package the chart
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm repo add valkey https://valkey.io/valkey-helm/
          helm dependency build charts/koshin
          helm package charts/koshin --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Push to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "dist/koshin-$VERSION.tgz" "$REGISTRY"
          echo "### Chart Published: \`$REGISTRY/koshin:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
