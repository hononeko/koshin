name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      snapshot: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.pull_request.labels.*.name, 'snapshot') }}
      tag: ${{ steps.version.outputs.snapshot-tag }}
      version: ${{ steps.version.outputs.snapshot-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Version
        id: version
        uses: hononeko/actions/version@v1
        with:
          pr-number: ${{ github.event.pull_request.number }}

  build:
    name: Build & Code Verification
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      security-events: write

  integration:
    name: Integration Tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Gradle & JDK
        uses: hononeko/actions/gradle-setup@v1

      - name: Run Integration Tests
        id: integration-tests
        run: ./gradlew integrationTest --no-daemon

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### Integration Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.integration-tests.outcome }}" = "success" ]; then
            echo "Integration tests completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Integration tests failed." >> "$GITHUB_STEP_SUMMARY"
          fi

  manifests:
    name: Validate Manifests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate Kubernetes manifests
        run: |
          if [ -d k8s/overlays/minimal ]; then
            echo "Validating k8s/overlays/minimal..."
            kubectl kustomize k8s/overlays/minimal | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e -summary -ignore-missing-schemas -strict
          fi
          if [ -d k8s/overlays/ha ]; then
            echo "Validating k8s/overlays/ha..."
            kubectl kustomize k8s/overlays/ha | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e -summary -ignore-missing-schemas -strict
          fi

  chart:
    name: Helm Chart
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Lint
        run: ct lint --config .github/ct.yaml --all

      - name: Validate both profiles
        run: |
          for profile in minimal ha; do
            echo "Validating the $profile profile..."
            args=()
            [ "$profile" = ha ] && args=(-f charts/koshin/values-ha.yaml)
            helm template koshin charts/koshin -n koshin "${args[@]}" --api-versions keda.sh/v1alpha1/ScaledObject \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e -summary -ignore-missing-schemas -strict
          done

      - name: Check the chart README is up to date
        run: |
          docker run --rm -v "$PWD/charts:/helm-docs" jnorwood/helm-docs:v1.14.2@sha256:7e562b49ab6b1dbc50c3da8f2dd6ffa8a5c6bba327b1c6335cc15ce29267979c --chart-search-root /helm-docs
          git diff --exit-code -- charts/*/README.md || { echo "::error::Regenerate the chart README with helm-docs"; exit 1; }

      - name: List changed charts
        id: changed
        run: |
          if [ -n "$(ct list-changed --config .github/ct.yaml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The worker image bundles Renovate (~10 GB unpacked)
      - name: Free disk space
        if: steps.changed.outputs.changed == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Create kind cluster
        if: steps.changed.outputs.changed == 'true'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Install and test (minimal profile)
        if: steps.changed.outputs.changed == 'true'
        run: ct install --config .github/ct.yaml

  image:
    name: Image Build & Smoke Test
    needs: [plan, build, integration]
    uses: ./.github/workflows/image.yml
    with:
      push: ${{ needs.plan.outputs.snapshot == 'true' }}
      ref: ${{ github.event.pull_request.head.sha }}
      version: ${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      packages: write

  snapshot:
    name: "Snapshot: Publish"
    needs: [plan, image]
    if: needs.plan.outputs.snapshot == 'true'
    uses: ./.github/workflows/publish-snapshot.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      pr-number: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      pull-requests: write
