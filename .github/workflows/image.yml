name: Image

# Builds the proxy and worker images natively on amd64 and arm64 runners, one job each in parallel, smoke tests each
# on /healthz, and with `push`, pushes each image to GHCR by digest and uploads the digests as artifacts.
on:
  workflow_call:
    inputs:
      push:
        description: Push each architecture's image to GHCR by digest and upload the digests as artifacts
        type: boolean
        default: false
      ref:
        description: Commit ref to check out (used for pull request snapshots)
        type: string
        default: ""
      version:
        description: Version baked into the binary; "dev" when empty
        type: string
        default: ""

jobs:
  build:
    name: Image (${{ matrix.app }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [proxy, worker]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/koshin-${{ matrix.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, push by digest if push is true, and smoke-test that exact digest
      - name: Build image
        id: build
        uses: hononeko/actions/build-image@v1
        with:
          image: ${{ env.IMAGE }}
          file: docker/Dockerfile.${{ matrix.app }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ inputs.push }}
          tags: smoke-${{ matrix.app }}:${{ matrix.arch }}
          build-args: VERSION=${{ inputs.version || 'dev' }}
          cache-scope: ${{ matrix.app }}-${{ matrix.arch }}
          digest-artifact: digests-${{ matrix.app }}-${{ matrix.arch }}

      - name: Smoke test
        uses: hononeko/actions/smoke-test@v1
        with:
          image: ${{ inputs.push && format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) || format('smoke-{0}:{1}', matrix.app, matrix.arch) }}
          port: "8080"
          path: /healthz
          status: "200"
          max-memory-mib: "384"

      - name: Check logs are JSON
        env:
          SMOKE_IMAGE: ${{ inputs.push && format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) || format('smoke-{0}:{1}', matrix.app, matrix.arch) }}
        run: .github/scripts/check-json-logs.sh "$SMOKE_IMAGE"
