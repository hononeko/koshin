# `ct install` on kind: the minimal profile with test-only inline secrets, scaled to zero (worker.autoscaling.minReplicas:
# 0): the test run starts a burst worker Job, which exits once it's done
proxy:
  replicas: 1
  secrets:
    githubWebhookSecret: ci-webhook-secret
    internalTriggerToken: ci-trigger-token
  sweepRepositories:
    - github:hononeko/koshin
worker:
  secrets:
    # Rejected by GitHub: Renovate fails at its first API call and the worker ACKs the job
    githubToken: ci-invalid-token
  renovate:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
  workspaceSizeLimit: 2Gi
# proxy -> NATS -> burst worker Job -> Renovate -> ACK, on a run Renovate fails fast. The Job pulls the Renovate image
# (~10 GB) during the test, as no worker ran before it.
tests:
  jobProcessing:
    enabled: true
    timeoutSeconds: 840
