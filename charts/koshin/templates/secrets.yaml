{{- /* Created only from inline values, which are for testing: use existingSecret in production */}}
{{- if and (not .Values.proxy.existingSecret) (include "koshin.proxyInlineSecrets" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "koshin.fullname" . }}-proxy
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "proxy") | nindent 4 }}
type: Opaque
data:
  {{- with .Values.proxy.secrets }}
  {{- with .githubWebhookSecret }}
  GITHUB_WEBHOOK_SECRET: {{ . | b64enc }}
  {{- end }}
  {{- with .gitlabWebhookSecret }}
  GITLAB_WEBHOOK_SECRET: {{ . | b64enc }}
  {{- end }}
  {{- with .internalTriggerToken }}
  INTERNAL_TRIGGER_TOKEN: {{ . | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if and (not .Values.worker.existingSecret) (include "koshin.workerInlineSecrets" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "koshin.fullname" . }}-worker
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
type: Opaque
data:
  {{- with .Values.worker.secrets }}
  {{- with .githubToken }}
  GITHUB_TOKEN: {{ . | b64enc }}
  {{- end }}
  {{- with .gitlabToken }}
  GITLAB_TOKEN: {{ . | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if and (not .Values.github.app.existingSecret) .Values.github.app.privateKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "koshin.fullname" . }}-github-app
  labels:
    {{- include "koshin.labels" (dict "ctx" .) | nindent 4 }}
type: Opaque
data:
  private-key.pem: {{ .Values.github.app.privateKey | b64enc }}
{{- end }}
