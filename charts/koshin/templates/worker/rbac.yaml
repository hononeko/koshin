apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "koshin.fullname" . }}-worker
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
  {{- with .Values.worker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The worker pod mounts a short-lived token into the worker container only
automountServiceAccountToken: false
{{- if .Values.worker.podDeletionCost.enabled }}
---
# Lets each worker patch its own controller.kubernetes.io/pod-deletion-cost annotation, so scale-in removes idle
# workers before busy ones. RBAC can't name a pod that doesn't exist yet: the admission policy below narrows it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "koshin.fullname" . }}-worker
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "koshin.fullname" . }}-worker
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "koshin.fullname" . }}-worker
subjects:
  - kind: ServiceAccount
    name: {{ include "koshin.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
{{- if .Values.worker.podDeletionCost.admissionPolicy }}
{{- $name := printf "%s-worker.%s" (include "koshin.fullname" .) .Release.Namespace }}
---
# The worker's ServiceAccount may only change the pod-deletion-cost annotation of its own pod: no other pod, and no
# spec, label or other metadata change.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["*"]
        resources: ["pods", "pods/*"]
  matchConditions:
    - name: worker-service-account
      expression: >-
        request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:{{ include "koshin.fullname" . }}-worker'
  variables:
    - name: costAnnotation
      expression: "'controller.kubernetes.io/pod-deletion-cost'"
    - name: annotations
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: oldAnnotations
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
  validations:
    - expression: "request.operation == 'UPDATE' && request.subResource == ''"
      message: The koshin worker may only patch pods.
    - expression: >-
        request.operation != 'UPDATE' ||
        ('authentication.kubernetes.io/pod-name' in request.userInfo.extra &&
        request.userInfo.extra['authentication.kubernetes.io/pod-name'] == [object.metadata.name])
      message: The koshin worker may only patch its own pod.
    - expression: >-
        request.operation != 'UPDATE' || (
        object.spec == oldObject.spec &&
        (has(object.metadata.labels) ? object.metadata.labels : {}) ==
        (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) &&
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) ==
        (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []) &&
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) ==
        (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : []) &&
        variables.annotations.all(k, k == variables.costAnnotation ||
        (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.annotations[k])) &&
        variables.oldAnnotations.all(k, k == variables.costAnnotation || k in variables.annotations))
      message: The koshin worker may only change the controller.kubernetes.io/pod-deletion-cost annotation.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
{{- end }}
