apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "koshin.fullname" . }}-worker
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
  {{- with .Values.worker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.worker.podDeletionCost.enabled }}
{{- if .Values.worker.podDeletionCost.enabled }}
---
# Lets each worker patch its own controller.kubernetes.io/pod-deletion-cost annotation, so scale-in removes idle
# workers before busy ones.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "koshin.fullname" . }}-worker
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "koshin.fullname" . }}-worker
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "koshin.fullname" . }}-worker
subjects:
  - kind: ServiceAccount
    name: {{ include "koshin.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
