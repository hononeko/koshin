apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "koshin.fullname" . }}-worker
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
  {{- with .Values.worker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Workers never call the Kubernetes API (KSH-31): no token is mounted
automountServiceAccountToken: false
