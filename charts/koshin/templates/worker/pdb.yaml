{{- $enabled := .Values.worker.podDisruptionBudget.enabled }}
{{- if kindIs "invalid" $enabled }}{{ $enabled = eq .Values.profile "ha" }}{{ end }}
{{- if and $enabled (include "koshin.workerDeploymentEnabled" .) }}
# For node drains, covering the Deployment's workers only: a PDB can't count Job pods
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "koshin.fullname" . }}-worker
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "koshin.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
      koshin.hononeko.dev/worker-mode: {{ ternary "warm" "static" .Values.worker.autoscaling.enabled }}
{{- end }}
