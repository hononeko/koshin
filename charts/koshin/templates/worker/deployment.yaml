{{- if include "koshin.workerDeploymentEnabled" . }}
{{- $autoscaling := .Values.worker.autoscaling.enabled }}
# With autoscaling, the always-warm worker of `minReplicas: 1`: one replica that `helm upgrade` rolls and nothing
# scales in, while burst Jobs add the rest. Without it, `worker.replicas` static workers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "koshin.fullname" . }}-worker
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ ternary 1 .Values.worker.replicas $autoscaling }}
  selector:
    matchLabels:
      {{- include "koshin.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    {{- include "koshin.workerPod" (dict "ctx" . "mode" (ternary "warm" "static" $autoscaling) "restartPolicy" "Always" "idleTimeoutSeconds" 0 "maxLifetimeSeconds" 0) | nindent 4 }}
{{- end }}
