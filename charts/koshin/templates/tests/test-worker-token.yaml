{{- if and .Values.worker.podDeletionCost.enabled .Values.worker.podDeletionCost.admissionPolicy }}
# With the worker's ServiceAccount, a pod may change its own pod-deletion-cost annotation and nothing else
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "koshin.fullname" . }}-test-worker-token
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "koshin.fullname" . }}-worker
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: patch
      image: "{{ .Values.sweeper.image.repository }}:{{ .Values.sweeper.image.tag }}"
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      command:
        - sh
        - -c
        - |
          set -u
          sa=/var/run/secrets/kubernetes.io/serviceaccount
          failed=0
          expect() {
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --cacert "$sa/ca.crt" -X PATCH \
              -H "Authorization: Bearer $(cat "$sa/token")" -H 'Content-Type: application/merge-patch+json' \
              "https://kubernetes.default.svc/api/v1/namespaces/$POD_NAMESPACE/pods/$POD_NAME" -d "$2")
            if [ "$code" = "$1" ]; then echo "ok $code: $2"; else echo "FAIL $code (want $1): $2"; cat /tmp/body; failed=1; fi
          }
          expect 200 '{"metadata":{"annotations":{"controller.kubernetes.io/pod-deletion-cost":"1000"}}}'
          expect 422 '{"metadata":{"labels":{"koshin-test":"x"}}}'
          expect 422 '{"metadata":{"annotations":{"koshin-test":"x"}}}'
          expect 422 '{"spec":{"activeDeadlineSeconds":3600}}'
          exit "$failed"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    {{- include "koshin.kubeApiAccessVolume" . | nindent 4 }}
    - name: tmp
      emptyDir: {}
{{- end }}
