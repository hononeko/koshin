{{- if .Values.networkPolicy.enabled }}
# Webhooks reach the proxy from anywhere (or networkPolicy.proxyFrom); the sweeper and tests always can
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koshin.fullname" . }}-proxy
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "proxy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "koshin.selectorLabels" (dict "ctx" . "component" "proxy") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.proxyFrom }}
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Workers serve only their probes
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koshin.fullname" . }}-worker
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "koshin.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
{{- if or .Values.nats.enabled .Values.valkey.enabled (index .Values "valkey-cache").enabled }}
---
# NATS and Valkey accept only this release's pods, plus KEDA on the NATS monitoring port
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "koshin.fullname" . }}-backends
  labels:
    {{- include "koshin.labels" (dict "ctx" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [nats, valkey, valkey-sentinel, valkey-cache]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if .Values.nats.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.kedaNamespaceSelector | nindent 12 }}
      ports:
        - port: {{ .Values.nats.config.monitor.port }}
    {{- end }}
{{- end }}
{{- end }}
