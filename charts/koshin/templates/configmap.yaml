apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "koshin.fullname" . }}-config
  labels:
    {{- include "koshin.labels" (dict "ctx" .) | nindent 4 }}
data:
  PLATFORMS: {{ join "," .Values.platforms | quote }}
  LOG_LEVEL: {{ .Values.logging.level | quote }}
  ROOT_LOG_LEVEL: {{ .Values.logging.rootLevel | quote }}
  RENOVATE_LOG_LEVEL: {{ .Values.logging.renovateLevel | quote }}
  HTTP2_ENABLED: {{ .Values.http2Enabled | quote }}
  NATS_URL: {{ include "koshin.natsUrl" . | quote }}
  NATS_STREAM_NAME: {{ .Values.natsSettings.streamName | quote }}
  NATS_STREAM_REPLICAS: {{ include "koshin.natsStreamReplicas" . | quote }}
  NATS_ACK_WAIT_SECONDS: {{ .Values.natsSettings.ackWaitSeconds | quote }}
  NATS_MAX_DELIVER: {{ .Values.natsSettings.maxDeliver | quote }}
  NATS_EXHAUSTED_SWEEP_SECONDS: {{ .Values.natsSettings.exhaustedSweepSeconds | quote }}
  VALKEY_URL: {{ include "koshin.valkeyUrl" . | quote }}
  VALKEY_KEY_PREFIX: {{ .Values.valkeySettings.keyPrefix | quote }}
  VALKEY_COMMAND_TIMEOUT_SECONDS: {{ .Values.valkeySettings.commandTimeoutSeconds | quote }}
  LOCK_REPLICA_ACK_TIMEOUT_MS: {{ .Values.valkeySettings.lockReplicaAckTimeoutMs | quote }}
  {{- with include "koshin.renovateRedisUrl" . }}
  RENOVATE_REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.config }}
  LOCK_TTL_SECONDS: {{ .lockTtlSeconds | quote }}
  HEARTBEAT_INTERVAL_SECONDS: {{ .heartbeatIntervalSeconds | quote }}
  DIRTY_TTL_SECONDS: {{ .dirtyTtlSeconds | quote }}
  LOCK_COLLISION_RETRY_SECONDS: {{ .lockCollisionRetrySeconds | quote }}
  CLI_TIMEOUT_MINUTES: {{ .cliTimeoutMinutes | quote }}
  RENOVATE_BINARY_SOURCE: {{ .renovateBinarySource | quote }}
  {{- end }}
  {{- with .Values.worker.rateLimits }}
  MAX_CONCURRENT_RUNS_PER_PLATFORM: {{ .maxConcurrentRunsPerPlatform | quote }}
  {{- if not (kindIs "invalid" .maxRequestsPerSecond) }}
  RENOVATE_MAX_REQUESTS_PER_SECOND: {{ .maxRequestsPerSecond | quote }}
  {{- end }}
  {{- if not (kindIs "invalid" .concurrentRequestLimit) }}
  RENOVATE_CONCURRENT_REQUEST_LIMIT: {{ .concurrentRequestLimit | quote }}
  {{- end }}
  RATE_LIMIT_BACKOFF_BASE_SECONDS: {{ .backoffBaseSeconds | quote }}
  RATE_LIMIT_BACKOFF_MAX_SECONDS: {{ .backoffMaxSeconds | quote }}
  MAX_RATE_LIMIT_REQUEUES: {{ .maxRequeues | quote }}
  {{- with .logPattern }}
  RATE_LIMIT_LOG_PATTERN: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.worker.repoCache }}
  REPO_CACHE_PROVIDER: {{ .provider | quote }}
  {{- if eq .provider "nats" }}
  REPO_CACHE_BUCKET: {{ .bucket | quote }}
  {{- if not (kindIs "invalid" .maxBytes) }}
  REPO_CACHE_MAX_BYTES: {{ int64 .maxBytes | quote }}
  {{- end }}
  {{- if not (kindIs "invalid" .ttlDays) }}
  REPO_CACHE_TTL_DAYS: {{ .ttlDays | quote }}
  {{- end }}
  {{- else if eq .provider "s3" }}
  RENOVATE_REPOSITORY_CACHE_TYPE: {{ .s3.url | quote }}
  {{- with .s3.endpoint }}
  RENOVATE_S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  RENOVATE_S3_PATH_STYLE: {{ .s3.pathStyle | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.github.apiUrl }}
  GITHUB_API_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.github.botLogin }}
  GITHUB_BOT_LOGIN: {{ . | quote }}
  {{- end }}
  {{- with .Values.github.app.id }}
  GITHUB_APP_ID: {{ . | quote }}
  {{- end }}
  {{- if include "koshin.githubAppSecretName" . }}
  GITHUB_APP_PRIVATE_KEY_PATH: {{ include "koshin.githubAppKeyPath" . | quote }}
  {{- end }}
  {{- with .Values.gitlab.endpoint }}
  GITLAB_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.gitlab.botLogin }}
  GITLAB_BOT_LOGIN: {{ . | quote }}
  {{- end }}
  {{- with .Values.renovateBotLogins }}
  RENOVATE_BOT_LOGINS: {{ join "," . | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "koshin.fullname" . }}-repositories
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "proxy") | nindent 4 }}
data:
  repositories.txt: |
    {{- range .Values.proxy.sweepRepositories }}
    {{ . }}
    {{- end }}
