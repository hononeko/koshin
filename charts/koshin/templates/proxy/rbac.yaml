{{- if .Values.worker.autoscaling.enabled }}
# The proxy's worker dispatcher: reads the worker PodTemplate and starts burst worker Jobs, in this namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "koshin.fullname" . }}-proxy
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "proxy") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["podtemplates"]
    resourceNames: [{{ printf "%s-worker" (include "koshin.fullname" .) | quote }}]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "watch", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "koshin.fullname" . }}-proxy
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "proxy") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "koshin.fullname" . }}-proxy
subjects:
  - kind: ServiceAccount
    name: {{ include "koshin.fullname" . }}-proxy
    namespace: {{ .Release.Namespace }}
{{- end }}
