{{- if .Values.proxy.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "koshin.fullname" . }}-proxy
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "proxy") | nindent 4 }}
  {{- with .Values.proxy.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "proxy.httpRoute.parentRefs is required" .Values.proxy.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.proxy.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- range .Values.proxy.httpRoute.pathPrefixes }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
      backendRefs:
        - name: {{ include "koshin.fullname" . }}-proxy
          port: {{ .Values.proxy.service.port }}
{{- end }}
