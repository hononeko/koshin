apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "koshin.fullname" . }}-proxy
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "proxy") | nindent 4 }}
  {{- with .Values.proxy.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "koshin.fullname" . }}-proxy
  labels:
    {{- include "koshin.labels" (dict "ctx" . "component" "proxy") | nindent 4 }}
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      {{- include "koshin.selectorLabels" (dict "ctx" . "component" "proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "koshin.labels" (dict "ctx" . "component" "proxy") | nindent 8 }}
        {{- with .Values.proxy.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.proxy.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "koshin.fullname" . }}-proxy
      # The worker dispatcher gets a short-lived token (kube-api-access) instead
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.proxy.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        {{- if .Values.proxy.topologySpreadConstraints }}
        {{- toYaml .Values.proxy.topologySpreadConstraints | nindent 8 }}
        {{- else }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "koshin.selectorLabels" (dict "ctx" . "component" "proxy") | nindent 14 }}
        {{- end }}
      {{- with .Values.proxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.proxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.proxy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: proxy
          image: {{ include "koshin.image" (dict "ctx" . "image" .Values.proxy.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "koshin.fullname" . }}-config
            {{- with include "koshin.proxySecretName" . }}
            # GITHUB_WEBHOOK_SECRET, GITLAB_WEBHOOK_SECRET, INTERNAL_TRIGGER_TOKEN
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: SWEEP_REPOSITORIES_FILE
              value: /etc/koshin/repositories/repositories.txt
            # VALKEY_URL comes from the ConfigMap: the proxy coalesces webhooks before publishing (KSH-30)
            {{- with include "koshin.sentinelPasswordEnv" . }}{{ . | nindent 12 }}{{- end }}
            {{- with .Values.worker.autoscaling }}
            # Burst worker Jobs from the worker PodTemplate (KSH-32)
            - name: WORKER_DISPATCHER_ENABLED
              value: {{ .enabled | quote }}
            {{- if .enabled }}
            - name: WORKER_POD_TEMPLATE_NAME
              value: {{ printf "%s-worker" (include "koshin.fullname" $) | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WORKER_MAX_REPLICAS
              value: {{ include "koshin.workerMaxReplicas" $ | quote }}
            - name: MIN_WARM_WORKERS
              value: {{ .minReplicas | quote }}
            - name: WORKER_DISPATCH_INTERVAL_SECONDS
              value: {{ .dispatchIntervalSeconds | quote }}
            - name: WORKER_JOB_ACTIVE_DEADLINE_SECONDS
              value: {{ .jobActiveDeadlineSeconds | quote }}
            - name: WORKER_JOB_TTL_SECONDS
              value: {{ .jobTtlSecondsAfterFinished | quote }}
            {{- end }}
            {{- end }}
            {{- if include "koshin.encryptionEnabled" . }}
            # Served at GET /api/v1/encryption-key (KSH-25)
            - name: RENOVATE_PUBLIC_KEY_PATH
              value: {{ include "koshin.encryptionKeyDir" . }}/public.asc
            {{- end }}
            {{- with .Values.proxy.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.proxy.securityContext | nindent 12 }}
          volumeMounts:
            - name: repositories
              mountPath: /etc/koshin/repositories
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.worker.autoscaling.enabled }}
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
            {{- with include "koshin.githubAppVolumeMount" . }}{{ . | nindent 12 }}{{- end }}
            {{- if include "koshin.encryptionEnabled" . }}
            # The public key only
            {{- include "koshin.encryptionVolumeMount" . | nindent 12 }}
            {{- end }}
      volumes:
        - name: repositories
          configMap:
            name: {{ include "koshin.fullname" . }}-repositories
        - name: tmp
          emptyDir: {}
        {{- if .Values.worker.autoscaling.enabled }}
        {{- include "koshin.kubeApiAccessVolume" . | nindent 8 }}
        {{- end }}
        {{- with include "koshin.githubAppVolume" . }}{{ . | nindent 8 }}{{- end }}
        {{- if include "koshin.encryptionEnabled" . }}
        {{- include "koshin.encryptionVolume" (dict "ctx" . "private" false) | nindent 8 }}
        {{- end }}
